# nginx container: the only service that is published to your PC (port 8080).
# "app" is the Compose service name; Docker's internal DNS turns it into the app container's IP.
server {
    listen 80;
    server_name _;

    client_max_body_size 3m;          # a little above the app's 2 MB upload limit

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
