# Run everything with:  docker compose up -d --build
# Stop everything with: docker compose down        (add -v to also delete the data volume)

services:
  # ---- the Node.js app (built from ./app/Dockerfile) ----
  app:
    build: ./app
    image: cloud-notes:1.0
    container_name: cloud-notes-app
    init: true                      # tiny init process: forwards signals and cleans up zombies
    restart: unless-stopped
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in the .env file (copy .env.example to .env)}
      TRUST_PROXY: uniquelocal      # trust nginx on the private Docker network for the client IP
      APP_VERSION: "1.0.0"
    volumes:
      - notes-data:/data            # named volume: notes and uploads survive restarts and rebuilds
    networks:
      - backend
    expose:
      - "3000"                      # reachable by other containers only, NOT published to your PC
    read_only: true                 # the container's own filesystem is read-only...
    tmpfs:
      - /tmp                        # ...except an in-memory /tmp (and the /data volume above)
    cap_drop:
      - ALL                         # drop every Linux capability the app does not need
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m                 # resource limits, like the 300 MB limit in Module 3
    cpus: 0.5

  # ---- nginx reverse proxy (official image, our config mounted read-only) ----
  web:
    image: nginx:1.27-alpine
    container_name: cloud-notes-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy  # start nginx only after the app's HEALTHCHECK passes
    ports:
      - "8080:80"                   # PC port 8080 -> nginx port 80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

networks:
  backend:                          # private network; containers find each other by service name

volumes:
  notes-data:
